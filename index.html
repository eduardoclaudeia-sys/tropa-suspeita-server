<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>Drama Ragdoll V0.1</title>
  <style>
    :root{
      --bg:#0f172a; --panel:#111827; --card:#1f2937; --border:#334155;
      --text:#f8fafc; --muted:#94a3b8; --accent:#22c55e; --danger:#ef4444;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:linear-gradient(180deg,#0f172a,#111827);color:var(--text)}
    button,input,select{font:inherit}
    .app{max-width:1200px;margin:0 auto;padding:16px}
    .topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .meter{flex:1;min-width:220px}
    .meter-row{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px}
    .bar{height:14px;border-radius:999px;background:#273449;overflow:hidden}
    .bar>div{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#facc15,#ef4444);transition:width .2s}
    .pill,.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:12px;padding:10px 14px}
    .btn{cursor:pointer;font-weight:800}
    .btn:hover{filter:brightness(1.08)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px}
    .arena-card,.side-card{border:1px solid var(--border);background:rgba(17,24,39,.92);border-radius:18px;overflow:hidden}
    .arena-head{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px}
    .arena-wrap{position:relative;aspect-ratio:4/3;min-height:360px;background:
      radial-gradient(circle at 50% 20%,rgba(59,130,246,.14),transparent 30%),
      linear-gradient(180deg,#172033,#111827)}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .ko{position:absolute;left:16px;right:16px;top:16px;padding:12px;text-align:center;font-size:22px;font-weight:1000;border:1px solid var(--border);border-radius:14px;background:rgba(31,41,55,.95)}
    .hidden{display:none!important}
    .attacks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
    .attack{min-height:64px;border:1px solid var(--border);background:#172033;color:var(--text);border-radius:14px;padding:8px;font-weight:800;cursor:pointer}
    .attack:hover{background:#1f2937}
    .side{display:grid;gap:12px;align-content:start}
    .side-card{padding:14px}
    .side-card h3{margin:0 0 10px}
    label{display:block;font-size:13px;font-weight:700;margin-top:10px}
    input,select{width:100%;margin-top:6px;background:#0f172a;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px}
    .muted{color:var(--muted);font-size:13px;line-height:1.45}
    .log{min-height:42px}
    @media(max-width:860px){
      .layout{grid-template-columns:1fr}
      .attacks{grid-template-columns:repeat(2,1fr)}
      .side{grid-template-columns:1fr 1fr}
    }
    @media(max-width:560px){
      .app{padding:10px}
      .arena-wrap{min-height:430px}
      .attacks{grid-template-columns:1fr 1fr}
      .side{grid-template-columns:1fr}
      .arena-head{flex-direction:column}
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div class="meter">
        <div class="meter-row"><span>Nível de Drama</span><span id="dramaValue">0%</span></div>
        <div class="bar"><div id="dramaBar"></div></div>
      </div>
      <div class="pill">Combo <strong id="comboValue">x1</strong></div>
      <button id="resetBtn" class="btn">Reiniciar</button>
    </div>

    <div class="layout">
      <section>
        <div class="arena-card">
          <div class="arena-head">
            <strong>Arena do Grupo</strong>
            <span id="statusText" class="muted">Arraste o boneco e jogue contra as paredes</span>
          </div>
          <div id="arenaWrap" class="arena-wrap">
            <canvas id="gameCanvas"></canvas>
            <div id="koText" class="ko hidden">DRAMA MÁXIMO 🤯</div>
          </div>
        </div>

        <div class="attacks">
          <button class="attack" data-attack="messages">💬 Chuva de Mensagens</button>
          <button class="attack" data-attack="stickers">😹 Avalanche de Figurinhas</button>
          <button class="attack" data-attack="audio">🎙️ Áudio de 10 Minutos</button>
          <button class="attack" data-attack="leave">🚪 Sair do Grupo</button>
          <button class="attack" data-attack="roller">🚜 Rolo do Drama</button>
        </div>
      </section>

      <aside class="side">
        <div class="side-card">
          <h3>Personagem</h3>
          <label>Apelido
            <input id="nameInput" value="Amigo do Grupo" maxlength="24" />
          </label>
          <label>Cor da roupa
            <select id="shirtSelect">
              <option value="#6b7280">Cinza</option>
              <option value="#2563eb">Azul</option>
              <option value="#16a34a">Verde</option>
              <option value="#dc2626">Vermelho</option>
              <option value="#7c3aed">Roxo</option>
            </select>
          </label>
        </div>

        <div class="side-card">
          <h3>Como jogar</h3>
          <p class="muted">Segure qualquer parte do boneco, arraste e solte. Use ataques diferentes em sequência para aumentar o combo.</p>
        </div>

        <div class="side-card">
          <h3>Última zoeira</h3>
          <div id="eventLog" class="muted log">Nenhuma ainda.</div>
        </div>
      </aside>
    </div>
  </main>

  <script type="module">
    import Matter from "https://cdn.jsdelivr.net/npm/matter-js@0.20.0/+esm";

    const { Engine, Render, Runner, Bodies, Body, Composite, Constraint, Mouse, MouseConstraint, Events } = Matter;
    const wrap = document.getElementById('arenaWrap');
    const oldCanvas = document.getElementById('gameCanvas');
    const dramaBar = document.getElementById('dramaBar');
    const dramaValue = document.getElementById('dramaValue');
    const comboValue = document.getElementById('comboValue');
    const statusText = document.getElementById('statusText');
    const logEl = document.getElementById('eventLog');
    const koText = document.getElementById('koText');
    const nameInput = document.getElementById('nameInput');
    const shirtSelect = document.getElementById('shirtSelect');

    const engine = Engine.create();
    engine.gravity.y = 1.05;
    const world = engine.world;

    let render, runner;
    let ragdoll = [], floor;
    let drama = 0, combo = 1, lastAttack = '', comboTimer;
    let stageW = 800, stageH = 600;

    function sizeArena(){
      const r = wrap.getBoundingClientRect();
      stageW = Math.max(320, Math.round(r.width));
      stageH = Math.max(360, Math.round(r.height));
    }

    function clearWorld(){
      Composite.clear(world, false, true);
      ragdoll = [];
    }

    function part(x,y,w,h,opts={}){
      return Bodies.rectangle(x,y,w,h,{
        chamfer:{radius:Math.min(w,h)*0.28},
        friction:.5,restitution:.35,density:.0025,...opts
      });
    }

    function link(a,b,pa,pb,len=7,stiff=.75){
      return Constraint.create({
        bodyA:a, bodyB:b, pointA:pa, pointB:pb,
        length:len, stiffness:stiff, damping:.08
      });
    }

    function makeRagdoll(){
      const cx=stageW*.5, cy=stageH*.34, shirt=shirtSelect.value;
      const head=Bodies.circle(cx,cy-76,34,{restitution:.55,density:.0018,render:{fillStyle:'#f2c29b'}});
      const torso=part(cx,cy,58,92,{render:{fillStyle:shirt}});
      const uaL=part(cx-48,cy-12,22,68,{render:{fillStyle:shirt}});
      const uaR=part(cx+48,cy-12,22,68,{render:{fillStyle:shirt}});
      const laL=part(cx-62,cy+46,18,65,{render:{fillStyle:'#d1d5db'}});
      const laR=part(cx+62,cy+46,18,65,{render:{fillStyle:'#d1d5db'}});
      const legL=part(cx-20,cy+95,26,82,{render:{fillStyle:'#374151'}});
      const legR=part(cx+20,cy+95,26,82,{render:{fillStyle:'#374151'}});
      const shinL=part(cx-20,cy+165,22,72,{render:{fillStyle:'#111827'}});
      const shinR=part(cx+20,cy+165,22,72,{render:{fillStyle:'#111827'}});
      ragdoll=[head,torso,uaL,uaR,laL,laR,legL,legR,shinL,shinR];
      Composite.add(world,ragdoll);
      Composite.add(world,[
        link(head,torso,{x:0,y:28},{x:0,y:-45},4,.85),
        link(torso,uaL,{x:-29,y:-25},{x:0,y:-30}),
        link(torso,uaR,{x:29,y:-25},{x:0,y:-30}),
        link(uaL,laL,{x:0,y:31},{x:0,y:-30}),
        link(uaR,laR,{x:0,y:31},{x:0,y:-30}),
        link(torso,legL,{x:-18,y:43},{x:0,y:-38},8,.8),
        link(torso,legR,{x:18,y:43},{x:0,y:-38},8,.8),
        link(legL,shinL,{x:0,y:38},{x:0,y:-34},5,.78),
        link(legR,shinR,{x:0,y:38},{x:0,y:-34},5,.78)
      ]);
    }

    function buildArena(){
      clearWorld();
      sizeArena();
      floor=Bodies.rectangle(stageW/2,stageH+25,stageW+100,70,{isStatic:true,render:{fillStyle:'#475569'}});
      const left=Bodies.rectangle(-25,stageH/2,50,stageH,{isStatic:true,render:{fillStyle:'#334155'}});
      const right=Bodies.rectangle(stageW+25,stageH/2,50,stageH,{isStatic:true,render:{fillStyle:'#334155'}});
      const roof=Bodies.rectangle(stageW/2,-25,stageW+100,50,{isStatic:true,render:{fillStyle:'#334155'}});
      Composite.add(world,[floor,left,right,roof]);
      makeRagdoll();
    }

    function faceEmoji(){
      if(drama>=100)return '😵';
      if(drama>=75)return '😱';
      if(drama>=50)return '😖';
      if(drama>=25)return '😒';
      return '😏';
    }

    function updateHud(){
      drama=Math.max(0,Math.min(100,drama));
      dramaBar.style.width=drama+'%';
      dramaValue.textContent=Math.round(drama)+'%';
      comboValue.textContent='x'+combo;

      if(drama>=100){
        koText.classList.remove('hidden');
        burstStickers();
        setTimeout(()=>koText.classList.add('hidden'),1300);
        drama=0; combo=1;
        setTimeout(updateHud,200);
      }
    }

    function damage(amount,label){
      combo = label===lastAttack ? Math.max(1,combo-1) : Math.min(5,combo+1);
      lastAttack=label;
      clearTimeout(comboTimer);
      comboTimer=setTimeout(()=>{combo=1;lastAttack='';updateHud();},4500);
      const gain=Math.round(amount*combo*.6);
      drama+=gain;
      logEl.textContent=`${label} • +${gain} Drama`;
      updateHud();
    }

    function addBox(x,y,w,h,label,fill='#22c55e',vx=0,vy=0){
      const b=Bodies.rectangle(x,y,w,h,{restitution:.75,density:.006,render:{fillStyle:fill}});
      b.label=label;
      Body.setVelocity(b,{x:vx,y:vy});
      Composite.add(world,b);
      return b;
    }

    function rainMessages(){
      statusText.textContent='Chovendo mensagem no grupo...';
      for(let i=0;i<10;i++) setTimeout(()=>{
        addBox(40+Math.random()*(stageW-80),-40,42,32,'MSG','#22c55e',Math.random()*4-2,2)
      },i*90);
      damage(8,'Chuva de Mensagens');
    }

    function stickers(){
      statusText.textContent='Figurinhas fora de controle!';
      const colors=['#f59e0b','#a855f7','#06b6d4'];
      for(let i=0;i<14;i++) setTimeout(()=>{
        addBox(30+Math.random()*(stageW-60),-30,36,36,'STICKER',colors[i%3],Math.random()*6-3,3)
      },i*65);
      damage(10,'Avalanche de Figurinhas');
    }

    function audioBlast(){
      statusText.textContent='Áudio de 10 minutos em 2x...';
      const speaker=addBox(55,stageH*.55,70,70,'SPEAKER','#64748b');
      Body.setStatic(speaker,true);
      let n=0;
      const id=setInterval(()=>{
        ragdoll.forEach(p=>Body.applyForce(p.position,{x:.018,y:(Math.random()-.5)*.01}));
        n++;
        if(n>18){clearInterval(id);Composite.remove(world,speaker);}
      },70);
      damage(9,'Áudio de 10 Minutos');
    }

    function leaveGroup(){
      statusText.textContent='Você saiu do grupo.';
      Composite.remove(world,floor);
      ragdoll.forEach(p=>Body.applyForce(p.position,{x:(Math.random()-.5)*.004,y:.012}));
      setTimeout(()=>{
        Composite.add(world,floor);
        ragdoll.forEach((p,i)=>Body.setPosition(p,{x:stageW/2+(i%2?10:-10),y:stageH*.3+i*4}));
      },1600);
      damage(13,'Sair do Grupo');
    }

    function roller(){
      statusText.textContent='DRAMA chegando pela esquerda!';
      const r=addBox(-90,stageH-90,140,72,'ROLLER','#f97316',18,0);
      r.frictionAir=.005;
      setTimeout(()=>Composite.remove(world,r),2200);
      damage(14,'Rolo do Drama');
    }

    function burstStickers(){
      const colors=['#f43f5e','#22c55e','#3b82f6','#eab308'];
      for(let i=0;i<20;i++){
        const a=Math.PI*2*i/20, s=6+Math.random()*8;
        addBox(stageW/2,stageH*.35,24,24,'KO_STICKER',colors[i%4],Math.cos(a)*s,Math.sin(a)*s-4);
      }
    }

    function initRender(){
      sizeArena();

      if(render){
        Render.stop(render);
        if(render.canvas?.parentNode) render.canvas.remove();
      }
      const canvas=document.createElement('canvas');
      wrap.prepend(canvas);

      render=Render.create({
        element:wrap,
        canvas,
        engine,
        options:{
          width:stageW,height:stageH,wireframes:false,
          background:'transparent',pixelRatio:Math.min(devicePixelRatio||1,2)
        }
      });

      buildArena();
      Render.run(render);

      if(runner) Runner.stop(runner);
      runner=Runner.create();
      Runner.run(runner,engine);

      const mouse=Mouse.create(canvas);
      const mc=MouseConstraint.create(engine,{
        mouse,
        constraint:{stiffness:.18,render:{visible:false}}
      });
      Composite.add(world,mc);
      render.mouse=mouse;

      Events.on(render,'afterRender',()=>{
        const ctx=render.context, h=ragdoll[0];
        if(!h)return;

        ctx.save();
        ctx.font='30px system-ui';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(faceEmoji(),h.position.x,h.position.y+1);
        ctx.restore();

        ctx.save();
        ctx.font='700 14px system-ui';
        ctx.textAlign='center';
        ctx.fillStyle='rgba(255,255,255,.9)';
        ctx.fillText(nameInput.value||'Amigo',stageW/2,28);
        ctx.restore();
      });
    }

    document.querySelectorAll('.attack').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const a=btn.dataset.attack;
        if(a==='messages')rainMessages();
        if(a==='stickers')stickers();
        if(a==='audio')audioBlast();
        if(a==='leave')leaveGroup();
        if(a==='roller')roller();
      });
    });

    document.getElementById('resetBtn').addEventListener('click',()=>{
      drama=0; combo=1; lastAttack='';
      statusText.textContent='Arena reiniciada';
      logEl.textContent='Nenhuma ainda.';
      updateHud();
      buildArena();
    });

    shirtSelect.addEventListener('change',buildArena);

    let resizeTimer;
    window.addEventListener('resize',()=>{
      clearTimeout(resizeTimer);
      resizeTimer=setTimeout(initRender,220);
    });

    updateHud();
    initRender();
  </script>
</body>
</html>
